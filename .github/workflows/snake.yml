
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Plum Rose Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Madhulika-21
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F8DCCF&color_dots=%230D1117,%23211329,%2350345C,%23966477,%23D99A9B

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
